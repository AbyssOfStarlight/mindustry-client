sector.basin.description = \u0412 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435 \u043E\u0431\u043D\u0430\u0440\u0443\u0436\u0435\u043D\u043E \u0431\u043E\u043B\u044C\u0448\u043E\u0435 \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u043E\u0435 \u043F\u0440\u0438\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0435.\n\u041A\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0441\u043A\u043E\u0440\u0435\u0435 \u043F\u0440\u043E\u0438\u0437\u0432\u0435\u0434\u0438\u0442\u0435 \u0431\u043E\u0435\u0432\u044B\u0435 \u0435\u0434\u0438\u043D\u0438\u0446\u044B \u0438 \u0437\u0430\u0445\u0432\u0430\u0442\u0438\u0442\u0435 \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u0435 \u044F\u0434\u0440\u0430, \u0447\u0442\u043E\u0431\u044B \u0437\u0430\u043A\u0440\u0435\u043F\u0438\u0442\u044C\u0441\u044F \u0432 \u044D\u0442\u043E\u043C \u0440\u0435\u0433\u0438\u043E\u043D\u0435.
sector.marsh.description = \u0412 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435 \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u0441\u044F \u0430\u0440\u043A\u0438\u0446\u0438\u0442 \u0432 \u0431\u043E\u043B\u044C\u0448\u0438\u0445 \u043A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u0430\u0445, \u043D\u043E \u043E\u0433\u0440\u0430\u043D\u0438\u0447\u0435\u043D\u044B \u0436\u0435\u0440\u043B\u0430.\n\u0421\u0442\u0440\u043E\u0439\u0442\u0435 [accent]\u0445\u0438\u043C\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u043A\u0430\u043C\u0435\u0440\u044B \u0441\u0433\u043E\u0440\u0430\u043D\u0438\u044F[] \u0434\u043B\u044F \u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0438\u0438 \u044D\u043D\u0435\u0440\u0433\u0438\u0438.
sector.peaks.description = \u0418\u0437-\u0437\u0430 \u0433\u043E\u0440\u043D\u043E\u0439 \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u0438 \u0432 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435 \u0431\u043E\u043B\u044C\u0448\u0438\u043D\u0441\u0442\u0432\u043E \u0431\u043E\u0435\u0432\u044B\u0445 \u0435\u0434\u0438\u043D\u0438\u0446 \u0431\u0435\u0441\u043F\u043E\u043B\u0435\u0437\u043D\u044B. \u041F\u043E\u043D\u0430\u0434\u043E\u0431\u044F\u0442\u0441\u044F \u043B\u0435\u0442\u0430\u044E\u0449\u0438\u0435 \u043A\u043E\u0440\u0430\u0431\u043B\u0438.\n\u041E\u0441\u0442\u0435\u0440\u0435\u0433\u0430\u0439\u0442\u0435\u0441\u044C \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u0445 \u043F\u0440\u043E\u0442\u0438\u0432\u043E\u0432\u043E\u0437\u0434\u0443\u0448\u043D\u044B\u0445 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043E\u043A. \u0415\u0441\u0442\u044C \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E\u0441\u0442\u044C \u043E\u0442\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0447\u0430\u0441\u0442\u044C \u0438\u0437 \u043D\u0438\u0445, \u0435\u0441\u043B\u0438 \u0441\u043D\u0435\u0441\u0442\u0438 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u044E\u0449\u0438\u0435 \u0438\u0445 \u043F\u043E\u0441\u0442\u0440\u043E\u0439\u043A\u0438.
sector.ravine.description = \u042D\u0442\u043E\u0442 \u0441\u0435\u043A\u0442\u043E\u0440 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0432\u0430\u0436\u043D\u044B\u043C \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u043D\u044B\u043C \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u043E\u043C \u0434\u043B\u044F \u0432\u0440\u0430\u0433\u0430. \u041D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u0442\u043E, \u0447\u0442\u043E \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u0445 \u044F\u0434\u0435\u0440 \u0437\u0434\u0435\u0441\u044C \u043D\u0435 \u043E\u0431\u043D\u0430\u0440\u0443\u0436\u0435\u043D\u043E, \u043E\u0436\u0438\u0434\u0430\u0439\u0442\u0435 \u0440\u0430\u0437\u043D\u043E\u043E\u0431\u0440\u0430\u0437\u0438\u044F \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u0445 \u0430\u0442\u0430\u043A\u0443\u044E\u0449\u0438\u0445 \u0441\u0438\u043B.\n\u041F\u0440\u043E\u0438\u0437\u0432\u0435\u0434\u0438\u0442\u0435 [accent]\u043A\u0438\u043D\u0435\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0441\u043F\u043B\u0430\u0432[]. \u041F\u043E\u0441\u0442\u0440\u043E\u0439\u0442\u0435 \u0442\u0443\u0440\u0435\u043B\u0438 [accent]\u0411\u0435\u0434\u0441\u0442\u0432\u0438\u0435[].
sector.caldera-erekir.description = \u0420\u0435\u0441\u0443\u0440\u0441\u044B, \u043E\u0431\u043D\u0430\u0440\u0443\u0436\u0435\u043D\u043D\u044B\u0435 \u0432 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435, \u0440\u0430\u0437\u0431\u0440\u043E\u0441\u0430\u043D\u044B \u043F\u043E \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u043C \u043E\u0441\u0442\u0440\u043E\u0432\u0430\u043C.\n\u0418\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 \u0438 \u0437\u0430\u043F\u0443\u0441\u0442\u0438\u0442\u0435 \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u043D\u0443\u044E \u0441\u0438\u0441\u0442\u0435\u043C\u0443 \u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0435 \u0433\u0440\u0443\u0437\u043E\u0432\u044B\u0445 \u0434\u0440\u043E\u043D\u043E\u0432.
sector.stronghold.description = \u0411\u043E\u043B\u044C\u0448\u0430\u044F \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0430\u044F \u0431\u0430\u0437\u0430 \u0432 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435 \u043E\u0445\u0440\u0430\u043D\u044F\u0435\u0442 \u043E\u0433\u0440\u043E\u043C\u043D\u044B\u0435 \u0437\u0430\u043B\u0435\u0436\u0438 [accent]\u0442\u043E\u0440\u0438\u044F[].\n\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435 \u0435\u0433\u043E \u0434\u043B\u044F \u0438\u0437\u0443\u0447\u0435\u043D\u0438\u044F \u0431\u043E\u0435\u0432\u044B\u0445 \u0435\u0434\u0438\u043D\u0438\u0446 \u0438 \u0442\u0443\u0440\u0435\u043B\u0435\u0439 \u0431\u043E\u043B\u0435\u0435 \u0432\u044B\u0441\u043E\u043A\u043E\u0433\u043E \u0443\u0440\u043E\u0432\u043D\u044F.
sector.crevice.description = \u0421\u0432\u043E\u0438\u043C\u0438 \u0430\u0442\u0430\u043A\u0430\u043C\u0438 \u0432\u0440\u0430\u0433 \u0431\u0443\u0434\u0435\u0442 \u044F\u0440\u043E\u0441\u0442\u043D\u043E \u043F\u044B\u0442\u0430\u0442\u044C\u0441\u044F \u0443\u043D\u0438\u0447\u0442\u043E\u0436\u0438\u0442\u044C \u0432\u0430\u0448\u0443 \u0431\u0430\u0437\u0443 \u0432 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435.\n\u0418\u0437\u0443\u0447\u0435\u043D\u0438\u0435 [accent]\u043A\u0430\u0440\u0431\u0438\u0434\u0430[] \u0438 [accent]\u041F\u0438\u0440\u043E\u043B\u0438\u0437\u043D\u043E\u0433\u043E \u0433\u0435\u043D\u0435\u0440\u0430\u0442\u043E\u0440\u0430[] \u043C\u043E\u0436\u0435\u0442 \u043E\u043A\u0430\u0437\u0430\u0442\u044C\u0441\u044F \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u044B\u043C \u0434\u043B\u044F \u0432\u044B\u0436\u0438\u0432\u0430\u043D\u0438\u044F.
sector.siege.description = \u0412 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435 \u0435\u0441\u0442\u044C \u0434\u0432\u0430 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C\u043D\u044B\u0445 \u043A\u0430\u043D\u044C\u043E\u043D\u0430, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0437\u0430\u0441\u0442\u0430\u0432\u044F\u0442 \u0432\u0430\u0441 \u0430\u0442\u0430\u043A\u043E\u0432\u0430\u0442\u044C \u0441 \u0434\u0432\u0443\u0445 \u0441\u0442\u043E\u0440\u043E\u043D.\n\u0418\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 [accent]\u0446\u0438\u0430\u043D[], \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u043B\u0443\u0447\u0438\u0442\u044C \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E\u0441\u0442\u044C \u0441\u043E\u0437\u0434\u0430\u0432\u0430\u0442\u044C \u0435\u0449\u0435 \u0431\u043E\u043B\u0435\u0435 \u0441\u0438\u043B\u044C\u043D\u044B\u0435 \u0442\u0430\u043D\u043A\u043E\u0432\u044B\u0435 \u043F\u043E\u0434\u0440\u0430\u0437\u0434\u0435\u043B\u0435\u043D\u0438\u044F.\n\u0412\u043D\u0438\u043C\u0430\u043D\u0438\u0435: \u0431\u044B\u043B\u0438 \u043E\u0431\u043D\u0430\u0440\u0443\u0436\u0435\u043D\u044B \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u0435 \u0434\u0430\u043B\u044C\u043D\u043E\u0431\u043E\u0439\u043D\u044B\u0435 \u0440\u0430\u043A\u0435\u0442\u044B. \u0420\u0430\u043A\u0435\u0442\u044B \u043C\u043E\u0433\u0443\u0442 \u0431\u044B\u0442\u044C \u0441\u0431\u0438\u0442\u044B \u0434\u043E \u043F\u043E\u043F\u0430\u0434\u0430\u043D\u0438\u044F.
sector.crossroads.description = \u0412\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u0435 \u0431\u0430\u0437\u044B \u0432 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435 \u0440\u0430\u0441\u043F\u043E\u043B\u043E\u0436\u0438\u043B\u0438\u0441\u044C \u043D\u0430 \u043F\u0435\u0440\u0435\u0441\u0435\u0447\u0435\u043D\u043D\u043E\u0439 \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u0438. \u0418\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 \u0440\u0430\u0437\u043D\u044B\u0435 \u0442\u0438\u043F\u044B \u0431\u043E\u0435\u0432\u044B\u0445 \u0435\u0434\u0438\u043D\u0438\u0446, \u0447\u0442\u043E\u0431\u044B \u043F\u0440\u0438\u0441\u043F\u043E\u0441\u043E\u0431\u0438\u0442\u044C\u0441\u044F \u043A \u043D\u0435\u0439.\n\u041A\u0440\u043E\u043C\u0435 \u0442\u043E\u0433\u043E, \u043D\u0435\u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0431\u0430\u0437\u044B \u0437\u0430\u0449\u0438\u0449\u0435\u043D\u044B \u0449\u0438\u0442\u0430\u043C\u0438. \u0412\u044B\u044F\u0441\u043D\u0438\u0442\u0435, \u043A\u0430\u043A \u043E\u043D\u0438 \u043F\u043E\u043B\u0443\u0447\u0430\u044E\u0442 \u044D\u043D\u0435\u0440\u0433\u0438\u044E.
sector.karst.description = \u042D\u0442\u043E\u0442 \u0441\u0435\u043A\u0442\u043E\u0440 \u0431\u043E\u0433\u0430\u0442 \u0440\u0435\u0441\u0443\u0440\u0441\u0430\u043C\u0438, \u043D\u043E \u0431\u0443\u0434\u0435\u0442 \u0430\u0442\u0430\u043A\u043E\u0432\u0430\u043D \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u0441\u0440\u0430\u0437\u0443 \u043F\u043E\u0441\u043B\u0435 \u043F\u0440\u0438\u0437\u0435\u043C\u043B\u0435\u043D\u0438\u044F.\n\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435 \u044D\u0442\u0438 \u0440\u0435\u0441\u0443\u0440\u0441\u044B \u0441 \u0443\u043C\u043E\u043C \u0438 \u0438\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 [accent]\u0444\u0430\u0437\u043E\u0432\u0443\u044E \u0442\u043A\u0430\u043D\u044C[].
