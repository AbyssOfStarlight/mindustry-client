block.reinforced-bridge-conduit.description = \u041F\u0435\u0440\u0435\u043C\u0435\u0449\u0430\u0435\u0442 \u0436\u0438\u0434\u043A\u043E\u0441\u0442\u0438 \u043D\u0430\u0434 \u043B\u044E\u0431\u043E\u0439 \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u044C\u044E \u0438\u043B\u0438 \u0437\u0434\u0430\u043D\u0438\u044F\u043C\u0438.
