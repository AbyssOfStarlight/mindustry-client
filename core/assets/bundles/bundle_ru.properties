sector.lake.description = \u0428\u043B\u0430\u043A\u043E\u0432\u043E\u0435 \u043E\u0437\u0435\u0440\u043E \u0432 \u044D\u0442\u043E\u043C \u0441\u0435\u043A\u0442\u043E\u0440\u0435 \u0441\u0438\u043B\u044C\u043D\u043E \u043E\u0433\u0440\u0430\u043D\u0438\u0447\u0438\u0432\u0430\u0435\u0442 \u0432\u0430\u0441 \u0432 \u0432\u044B\u0431\u043E\u0440\u0435 \u0431\u043E\u0435\u0432\u044B\u0445 \u0435\u0434\u0438\u043D\u0438\u0446. \u0415\u0434\u0438\u043D\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u043C \u0432\u0430\u0440\u0438\u0430\u043D\u0442\u043E\u043C \u044F\u0432\u043B\u044F\u044E\u0442\u0441\u044F \u043F\u0430\u0440\u044F\u0449\u0438\u0435 \u0435\u0434\u0438\u043D\u0438\u0446\u044B.\n\u0418\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 [accent]\u0421\u0431\u043E\u0440\u0449\u0438\u043A \u043A\u043E\u0440\u0430\u0431\u043B\u0435\u0439[] \u0438 \u043F\u0440\u043E\u0438\u0437\u0432\u0435\u0434\u0438\u0442\u0435 \u0435\u0434\u0438\u043D\u0438\u0446\u044B [accent]\u0423\u043A\u043B\u043E\u043D\u0435\u043D\u0438\u0435[] \u043A\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0441\u043A\u043E\u0440\u0435\u0435.
sector.intersect.description = \u0421\u043A\u0430\u043D\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043F\u0440\u0435\u0434\u043F\u043E\u043B\u0430\u0433\u0430\u0435\u0442, \u0447\u0442\u043E \u044D\u0442\u043E\u0442 \u0441\u0435\u043A\u0442\u043E\u0440 \u0431\u0443\u0434\u0435\u0442 \u0430\u0442\u0430\u043A\u043E\u0432\u0430\u043D \u0441 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u0445 \u0441\u0442\u043E\u0440\u043E\u043D \u0432\u0441\u043A\u043E\u0440\u0435 \u043F\u043E\u0441\u043B\u0435 \u043F\u0440\u0438\u0437\u0435\u043C\u043B\u0435\u043D\u0438\u044F.\n\u0423\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0435 \u043E\u0431\u043E\u0440\u043E\u043D\u0443 \u0438 \u043D\u0430\u0447\u043D\u0438\u0442\u0435 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u044C \u0442\u0435\u0440\u0440\u0438\u0442\u043E\u0440\u0438\u044E \u043A\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0441\u043A\u043E\u0440\u0435\u0435.\n[accent]\u041C\u0435\u0445\u0438[] \u043F\u043E\u0442\u0440\u0435\u0431\u0443\u044E\u0442\u0441\u044F \u0434\u043B\u044F \u043F\u0440\u0435\u043E\u0434\u043E\u043B\u0435\u043D\u0438\u044F \u043F\u0435\u0440\u0435\u0441\u0435\u0447\u0435\u043D\u043D\u043E\u0439 \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u0438, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u043F\u0440\u0435\u043E\u0431\u043B\u0430\u0434\u0430\u0435\u0442 \u0432 \u044D\u0442\u043E\u043C \u0440\u0435\u0433\u0438\u043E\u043D\u0435.
