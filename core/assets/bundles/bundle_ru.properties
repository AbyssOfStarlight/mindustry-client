block.mend-projector.description = \u041F\u0435\u0440\u0438\u043E\u0434\u0438\u0447\u0435\u0441\u043A\u0438 \u0440\u0435\u043C\u043E\u043D\u0442\u0438\u0440\u0443\u0435\u0442 \u0431\u043B\u043E\u043A\u0438 \u0432 \u043D\u0435\u043F\u043E\u0441\u0440\u0435\u0434\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u0431\u043B\u0438\u0437\u043E\u0441\u0442\u0438.\n\u041E\u043F\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u0444\u0430\u0437\u043E\u0432\u0443\u044E \u0442\u043A\u0430\u043D\u044C \u0434\u043B\u044F \u0443\u0432\u0435\u043B\u0438\u0447\u0435\u043D\u0438\u044F \u0434\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u0438 \u044D\u0444\u0444\u0435\u043A\u0442\u0438\u0432\u043D\u043E\u0441\u0442\u0438.
block.overdrive-projector.description = \u0423\u0432\u0435\u043B\u0438\u0447\u0438\u0432\u0430\u0435\u0442 \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C \u0431\u043B\u0438\u0437\u043B\u0435\u0436\u0430\u0449\u0438\u0445 \u0437\u0434\u0430\u043D\u0438\u0439.\n\u041E\u043F\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u0444\u0430\u0437\u043E\u0432\u0443\u044E \u0442\u043A\u0430\u043D\u044C \u0434\u043B\u044F \u0443\u0432\u0435\u043B\u0438\u0447\u0435\u043D\u0438\u044F \u0434\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u0438 \u044D\u0444\u0444\u0435\u043A\u0442\u0438\u0432\u043D\u043E\u0441\u0442\u0438.
block.force-projector.description = \u0421\u043E\u0437\u0434\u0430\u0435\u0442 \u0432\u043E\u043A\u0440\u0443\u0433 \u0441\u0435\u0431\u044F \u0448\u0435\u0441\u0442\u0438\u0443\u0433\u043E\u043B\u044C\u043D\u043E\u0435 \u0441\u0438\u043B\u043E\u0432\u043E\u0435 \u043F\u043E\u043B\u0435, \u0437\u0430\u0449\u0438\u0449\u0430\u044F \u0437\u0434\u0430\u043D\u0438\u044F \u0438 \u0431\u043E\u0435\u0432\u044B\u0435 \u0435\u0434\u0438\u043D\u0438\u0446\u044B \u0432\u043D\u0443\u0442\u0440\u0438 \u043E\u0442 \u043F\u043E\u0432\u0440\u0435\u0436\u0434\u0435\u043D\u0438\u0439.\n\u041F\u0435\u0440\u0435\u0433\u0440\u0435\u0432\u0430\u0435\u0442\u0441\u044F, \u0435\u0441\u043B\u0438 \u043D\u0430\u043D\u0435\u0441\u0435\u043D\u043E \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u0431\u043E\u043B\u044C\u0448\u043E\u0435 \u043A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E \u043F\u043E\u0432\u0440\u0435\u0436\u0434\u0435\u043D\u0438\u0439. \u041E\u043F\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u043E\u0445\u043B\u0430\u0436\u0434\u0430\u044E\u0449\u0443\u044E \u0436\u0438\u0434\u043A\u043E\u0441\u0442\u044C \u0434\u043B\u044F \u043F\u0440\u0435\u0434\u043E\u0442\u0432\u0440\u0430\u0449\u0435\u043D\u0438\u044F \u043F\u0435\u0440\u0435\u0433\u0440\u0435\u0432\u0430. \u0424\u0430\u0437\u043E\u0432\u0430\u044F \u0442\u043A\u0430\u043D\u044C \u0443\u0432\u0435\u043B\u0438\u0447\u0438\u0432\u0430\u0435\u0442 \u0440\u0430\u0437\u043C\u0435\u0440 \u0449\u0438\u0442\u0430.
