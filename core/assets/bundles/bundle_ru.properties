sector.weatheredChannels.description = [gray][\u043E\u043F\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u0430\u044F \u0446\u0435\u043B\u044C][]\n\u042D\u0442\u0430 \u0441\u0438\u0441\u0442\u0435\u043C\u0430 \u043A\u0430\u043D\u0430\u043B\u043E\u0432 \u0431\u043E\u0433\u0430\u0442\u0430 \u0440\u0435\u0441\u0443\u0440\u0441\u0430\u043C\u0438. \u0420\u0430\u0437\u043C\u0435\u0441\u0442\u0438\u0442\u0435 \u0441\u0432\u043E\u0451 \u044F\u0434\u0440\u043E. \u041E\u0442\u0440\u0430\u0436\u0430\u0439\u0442\u0435 \u0432\u043E\u043B\u043D\u044B \u0432\u0440\u0430\u0433\u043E\u0432, \u0447\u0442\u043E\u0431\u044B \u0437\u0430\u0445\u0432\u0430\u0442\u0438\u0442\u044C \u0438\u0445.\n\n\u0412\u0440\u0430\u0433 \u0431\u0443\u0434\u0435\u0442 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u043E\u0432 \u0434\u043B\u044F \u0430\u0442\u0430\u043A\u0438 \u0432\u0430\u0448\u0435\u0433\u043E \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0430. \u0421\u043B\u0435\u0434\u0438\u0442\u0435 \u0437\u0430 \u043F\u0440\u0438\u0437\u043D\u0430\u043A\u0430\u043C\u0438 \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E\u0439 \u0437\u0430\u0441\u0430\u0434\u044B \u0438 \u0437\u0430\u0449\u0438\u0449\u0430\u0439\u0442\u0435\u0441\u044C \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0435\u043D\u043D\u043E.
