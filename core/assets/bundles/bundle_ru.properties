sector.groundZero.description = \u041E\u043F\u0442\u0438\u043C\u0430\u043B\u044C\u043D\u0430\u044F \u043B\u043E\u043A\u0430\u0446\u0438\u044F \u0447\u0442\u043E\u0431\u044B \u043D\u0430\u0447\u0430\u0442\u044C \u0441\u043D\u0430\u0447\u0430\u043B\u0430. \u041D\u0438\u0437\u043A\u0430\u044F \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0430\u044F \u0443\u0433\u0440\u043E\u0437\u0430. \u041D\u0435\u043C\u043D\u043E\u0433\u043E \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432.\n\u0421\u043E\u0431\u0435\u0440\u0438\u0442\u0435 \u043A\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0431\u043E\u043B\u044C\u0448\u0435 \u0441\u0432\u0438\u043D\u0446\u0430 \u0438 \u043C\u0435\u0434\u0438.\n\u0414\u0432\u0438\u0433\u0430\u0439\u0442\u0435\u0441\u044C \u0434\u0430\u043B\u044C\u0448\u0435.
sector.frozenForest.description = \u0414\u0430\u0436\u0435 \u0437\u0434\u0435\u0441\u044C, \u0431\u043B\u0438\u0436\u0435 \u043A \u0433\u043E\u0440\u0430\u043C, \u0441\u043F\u043E\u0440\u044B \u0440\u0430\u0441\u043F\u0440\u043E\u0441\u0442\u0440\u0430\u043D\u0438\u043B\u0438\u0441\u044C. \u041D\u0438\u0437\u043A\u0438\u0435 \u0442\u0435\u043C\u043F\u0435\u0440\u0430\u0442\u0443\u0440\u044B \u043D\u0435 \u043C\u043E\u0433\u0443\u0442 \u0441\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0442\u044C \u0438\u0445 \u0432\u0435\u0447\u043D\u043E.\n\n\u041D\u0430\u0447\u043D\u0438\u0442\u0435 \u0432\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0442\u044C\u0441\u044F \u0432 \u044D\u043D\u0435\u0440\u0433\u0438\u044E. \u041F\u043E\u0441\u0442\u0440\u043E\u0439\u0442\u0435 \u0433\u0435\u043D\u0435\u0440\u0430\u0442\u043E\u0440\u044B \u0432\u043D\u0443\u0442\u0440\u0435\u043D\u043D\u0435\u0433\u043E \u0441\u0433\u043E\u0440\u0430\u043D\u0438\u044F. \u041D\u0430\u0443\u0447\u0438\u0442\u0435\u0441\u044C \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u0440\u0435\u0433\u0435\u043D\u0435\u0440\u0430\u0442\u043E\u0440\u043E\u043C.
sector.saltFlats.description = \u041D\u0430 \u043E\u043A\u0440\u0430\u0438\u043D\u0435 \u043F\u0443\u0441\u0442\u044B\u043D\u0438 \u043B\u0435\u0436\u0430\u0442 \u0441\u043E\u043B\u044F\u043D\u044B\u0435 \u0440\u0430\u0432\u043D\u0438\u043D\u044B. \u0412 \u044D\u0442\u043E\u0439 \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u0438 \u043C\u043E\u0436\u043D\u043E \u043D\u0430\u0439\u0442\u0438 \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432.\n\n\u0412\u0440\u0430\u0433\u0438 \u0432\u043E\u0437\u0432\u0435\u043B\u0438 \u0437\u0434\u0435\u0441\u044C \u043A\u043E\u043C\u043F\u043B\u0435\u043A\u0441 \u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432. \u0418\u0441\u043A\u043E\u0440\u0435\u043D\u0438\u0442\u0435 \u0438\u0445 \u044F\u0434\u0440\u043E. \u041D\u0435 \u043E\u0441\u0442\u0430\u0432\u044C\u0442\u0435 \u043A\u0430\u043C\u043D\u044F \u043D\u0430 \u043A\u0430\u043C\u043D\u0435.
sector.crateredBattleground.description = \u0412 \u044D\u0442\u043E\u043C \u043A\u0440\u0430\u0442\u0435\u0440\u0435, \u043E\u0441\u0442\u0430\u0432\u0448\u0435\u043C\u0441\u044F \u0441\u043E \u0432\u0440\u0435\u043C\u0451\u043D \u0441\u0442\u0430\u0440\u044B\u0445 \u0432\u043E\u0439\u043D, \u0441\u043A\u043E\u043F\u0438\u043B\u0430\u0441\u044C \u0432\u043E\u0434\u0430.\n\u0412\u0435\u0440\u043D\u0438\u0442\u0435 \u044D\u0442\u0443 \u0442\u0435\u0440\u0440\u0438\u0442\u043E\u0440\u0438\u044E \u043F\u043E\u0434 \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u044C. \u0421\u043E\u0431\u0438\u0440\u0430\u0439\u0442\u0435 \u043F\u0435\u0441\u043E\u043A. \u0412\u044B\u043F\u043B\u0430\u0432\u043B\u044F\u0439\u0442\u0435 \u043C\u0435\u0442\u0430\u0441\u0442\u0435\u043A\u043B\u043E.\n\u041A\u0430\u0447\u0430\u0439\u0442\u0435 \u0432\u043E\u0434\u0443 \u0434\u043B\u044F \u043E\u0445\u043B\u0430\u0436\u0434\u0435\u043D\u0438\u044F \u0442\u0443\u0440\u0435\u043B\u0435\u0439 \u0438 \u0431\u0443\u0440\u043E\u0432.
sector.ruinousShores.description = \u041C\u0438\u043C\u043E \u043F\u0443\u0441\u0442\u043E\u0448\u0435\u0439 \u043F\u0440\u043E\u0445\u043E\u0434\u0438\u0442 \u0431\u0435\u0440\u0435\u0433\u043E\u0432\u0430\u044F \u043B\u0438\u043D\u0438\u044F. \u041A\u043E\u0433\u0434\u0430-\u0442\u043E \u0437\u0434\u0435\u0441\u044C \u0440\u0430\u0441\u043F\u043E\u043B\u0430\u0433\u0430\u043B\u0441\u044F \u043C\u0430\u0441\u0441\u0438\u0432 \u0431\u0435\u0440\u0435\u0433\u043E\u0432\u043E\u0439 \u043E\u0431\u043E\u0440\u043E\u043D\u044B. \u041D\u0435 \u0442\u0430\u043A \u043C\u043D\u043E\u0433\u043E \u043E\u0442 \u043D\u0435\u0433\u043E \u043E\u0441\u0442\u0430\u043B\u043E\u0441\u044C. \u0422\u043E\u043B\u044C\u043A\u043E \u0441\u0430\u043C\u044B\u0435 \u0431\u0430\u0437\u043E\u0432\u044B\u0435 \u043E\u0431\u043E\u0440\u043E\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u0441\u043E\u043E\u0440\u0443\u0436\u0435\u043D\u0438\u044F \u043E\u0441\u0442\u0430\u043B\u0438\u0441\u044C \u043D\u0435\u0432\u0440\u0435\u0434\u0438\u043C\u044B\u043C\u0438, \u0432\u0441\u0451 \u043E\u0441\u0442\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0440\u0435\u0432\u0440\u0430\u0442\u0438\u043B\u043E\u0441\u044C \u0432 \u043C\u0435\u0442\u0430\u043B\u043B\u043E\u043B\u043E\u043C.\n\u041F\u0440\u043E\u0434\u043E\u043B\u0436\u0430\u0439\u0442\u0435 \u044D\u043A\u0441\u043F\u0430\u043D\u0441\u0438\u044E \u0432\u043E\u0432\u043D\u0435. \u041F\u0435\u0440\u0435\u043E\u0442\u043A\u0440\u043E\u0439\u0442\u0435 \u0434\u043B\u044F \u0441\u0435\u0431\u044F \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0438.
sector.stainedMountains.description = \u0414\u0430\u043B\u044C\u0448\u0435, \u0432\u0433\u043B\u0443\u0431\u044C \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u0438, \u043B\u0435\u0436\u0430\u0442 \u0433\u043E\u0440\u044B, \u0435\u0449\u0435 \u043D\u0435 \u0437\u0430\u043F\u044F\u0442\u043D\u0430\u043D\u043D\u044B\u0435 \u0441\u043F\u043E\u0440\u0430\u043C\u0438.\n\u0418\u0437\u0432\u043B\u0435\u043A\u0438\u0442\u0435 \u0438\u0437\u043E\u0431\u0438\u043B\u0438\u0435 \u0442\u0438\u0442\u0430\u043D\u0430 \u0432 \u044D\u0442\u043E\u0439 \u043E\u0431\u043B\u0430\u0441\u0442\u0438. \u041D\u0430\u0443\u0447\u0438\u0442\u0435\u0441\u044C \u0438\u043C \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\u0441\u044F.\n\n\u0412\u0440\u0430\u0436\u0435\u0441\u043A\u043E\u0435 \u043F\u0440\u0438\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0435 \u0437\u0434\u0435\u0441\u044C \u0441\u0438\u043B\u044C\u043D\u0435\u0435. \u041D\u0435 \u0434\u0430\u0439\u0442\u0435 \u0438\u043C \u0432\u0440\u0435\u043C\u0435\u043D\u0438 \u0434\u043B\u044F \u043E\u0442\u043F\u0440\u0430\u0432\u043A\u0438 \u0441\u0432\u043E\u0438\u0445 \u0441\u0438\u043B\u044C\u043D\u0435\u0439\u0448\u0438\u0445 \u0431\u043E\u0435\u0432\u044B\u0445 \u0435\u0434\u0438\u043D\u0438\u0446.
sector.overgrowth.description = \u042D\u0442\u0430 \u0437\u0430\u0440\u043E\u0441\u0448\u0430\u044F \u043E\u0431\u043B\u0430\u0441\u0442\u044C \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u0441\u044F \u0431\u043B\u0438\u0436\u0435 \u043A \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\u0443 \u0441\u043F\u043E\u0440.\n\u0412\u0440\u0430\u0433 \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u043E\u0432\u0430\u043B \u0437\u0434\u0435\u0441\u044C \u0444\u043E\u0440\u043F\u043E\u0441\u0442. \u041F\u043E\u0441\u0442\u0440\u043E\u0439\u0442\u0435 \u0431\u043E\u0435\u0432\u044B\u0435 \u0435\u0434\u0438\u043D\u0438\u0446\u044B \u00AB\u0411\u0443\u043B\u0430\u0432\u0430\u00BB. \u0423\u043D\u0438\u0447\u0442\u043E\u0436\u044C\u0442\u0435 \u0435\u0433\u043E. \u0412\u0435\u0440\u043D\u0438\u0442\u0435 \u0442\u043E, \u0447\u0442\u043E \u0431\u044B\u043B\u043E \u043F\u043E\u0442\u0435\u0440\u044F\u043D\u043E.
sector.tarFields.description = \u041E\u043A\u0440\u0430\u0438\u043D\u0430 \u0437\u043E\u043D\u044B \u043D\u0435\u0444\u0442\u0435\u0434\u043E\u0431\u044B\u0447\u0438, \u043C\u0435\u0436\u0434\u0443 \u0433\u043E\u0440\u0430\u043C\u0438 \u0438 \u043F\u0443\u0441\u0442\u044B\u043D\u0435\u0439. \u041E\u0434\u0438\u043D \u0438\u0437 \u043D\u0435\u043C\u043D\u043E\u0433\u0438\u0445 \u0440\u0430\u0439\u043E\u043D\u043E\u0432 \u0441 \u043F\u043E\u043B\u0435\u0437\u043D\u044B\u043C\u0438 \u0437\u0430\u043F\u0430\u0441\u0430\u043C\u0438 \u043D\u0435\u0444\u0442\u0438.\n\u0425\u043E\u0442\u044F \u044D\u0442\u0430 \u043E\u0431\u043B\u0430\u0441\u0442\u044C \u0437\u0430\u0431\u0440\u043E\u0448\u0435\u043D\u0430, \u0432 \u043D\u0435\u0439 \u043F\u043E\u0431\u043B\u0438\u0437\u043E\u0441\u0442\u0438 \u043F\u0440\u0438\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u044E\u0442 \u043D\u0435\u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043E\u043F\u0430\u0441\u043D\u044B\u0435 \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u0435 \u0441\u0438\u043B\u044B. \u041D\u0435 \u0441\u0442\u043E\u0438\u0442 \u0438\u0445 \u043D\u0435\u0434\u043E\u043E\u0446\u0435\u043D\u0438\u0432\u0430\u0442\u044C.\n\n[lightgray]\u0418\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044E \u043F\u0435\u0440\u0435\u0440\u0430\u0431\u043E\u0442\u043A\u0438 \u043D\u0435\u0444\u0442\u0438, \u0435\u0441\u043B\u0438 \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E.
sector.desolateRift.description = \u0427\u0440\u0435\u0437\u0432\u044B\u0447\u0430\u0439\u043D\u043E \u043E\u043F\u0430\u0441\u043D\u0430\u044F \u0437\u043E\u043D\u0430. \u041E\u0431\u0438\u043B\u0438\u0435 \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432, \u043D\u043E \u043C\u0430\u043B\u043E \u043C\u0435\u0441\u0442\u0430. \u0412\u044B\u0441\u043E\u043A\u0438\u0439 \u0440\u0438\u0441\u043A \u0440\u0430\u0437\u0440\u0443\u0448\u0435\u043D\u0438\u044F. \u042D\u0432\u0430\u043A\u0443\u0438\u0440\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u043D\u0443\u0436\u043D\u043E \u043A\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0441\u043A\u043E\u0440\u0435\u0435. \u041D\u0435 \u0440\u0430\u0441\u0441\u043B\u0430\u0431\u043B\u044F\u0439\u0442\u0435\u0441\u044C \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0431\u043E\u043B\u044C\u0448\u0438\u0445 \u043F\u0435\u0440\u0435\u0440\u044B\u0432\u043E\u0432 \u043C\u0435\u0436\u0434\u0443 \u0432\u0440\u0430\u0436\u0435\u0441\u043A\u0438\u043C\u0438 \u0430\u0442\u0430\u043A\u0430\u043C\u0438.
sector.nuclearComplex.description = \u0411\u044B\u0432\u0448\u0438\u0439 \u0437\u0430\u0432\u043E\u0434 \u043F\u043E \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0443 \u0438 \u043F\u0435\u0440\u0435\u0440\u0430\u0431\u043E\u0442\u043A\u0435 \u0442\u043E\u0440\u0438\u044F, \u043F\u0440\u0435\u0432\u0440\u0430\u0449\u0435\u043D\u043D\u044B\u0439 \u0432 \u0440\u0443\u0438\u043D\u044B.\n[lightgray]\u0418\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 \u0442\u043E\u0440\u0438\u0439 \u0438 \u0432\u0430\u0440\u0438\u0430\u043D\u0442\u044B \u0435\u0433\u043E \u043C\u043D\u043E\u0433\u043E\u0447\u0438\u0441\u043B\u0435\u043D\u043D\u043E\u0433\u043E \u043F\u0440\u0438\u043C\u0435\u043D\u0435\u043D\u0438\u044F.\n\n\u0412\u0440\u0430\u0433 \u043F\u0440\u0438\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u0435\u0442 \u0437\u0434\u0435\u0441\u044C \u0432 \u0431\u043E\u043B\u044C\u0448\u043E\u043C \u0447\u0438\u0441\u043B\u0435, \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u043E \u0440\u0430\u0437\u0432\u0435\u0434\u044B\u0432\u0430\u044F \u043D\u0430\u043F\u0430\u0434\u0430\u044E\u0449\u0438\u0445.
sector.fungalPass.description = \u041F\u0435\u0440\u0435\u0445\u043E\u0434\u043D\u0430\u044F \u043E\u0431\u043B\u0430\u0441\u0442\u044C \u043C\u0435\u0436\u0434\u0443 \u0432\u044B\u0441\u043E\u043A\u0438\u043C\u0438 \u0433\u043E\u0440\u0430\u043C\u0438 \u0438 \u0431\u043E\u043B\u0435\u0435 \u043D\u0438\u0437\u043A\u0438\u043C\u0438, \u043F\u043E\u043A\u0440\u044B\u0442\u044B\u043C\u0438 \u0441\u043F\u043E\u0440\u0430\u043C\u0438 \u0437\u0435\u043C\u043B\u044F\u043C\u0438. \u0417\u0434\u0435\u0441\u044C \u0440\u0430\u0441\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0430 \u043D\u0435\u0431\u043E\u043B\u044C\u0448\u0430\u044F \u0440\u0430\u0437\u0432\u0435\u0434\u044B\u0432\u0430\u0442\u0435\u043B\u044C\u043D\u0430\u044F \u0431\u0430\u0437\u0430 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430.\n\u0423\u043D\u0438\u0447\u0442\u043E\u0436\u044C\u0442\u0435 \u0435\u0435.\n\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435 \u0435\u0434\u0438\u043D\u0438\u0446\u044B \u00AB\u041A\u0438\u043D\u0436\u0430\u043B\u00BB \u0438 \u00AB\u041F\u043E\u043B\u0437\u0443\u043D\u00BB. \u0414\u043E\u0441\u0442\u0430\u043D\u044C\u0442\u0435 \u0434\u043E \u043E\u0431\u043E\u0438\u0445 \u044F\u0434\u0435\u0440.
sector.biomassFacility.description = \u041F\u0435\u0440\u0432\u043E\u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A \u0441\u043F\u043E\u0440. \u041E\u0431\u044A\u0435\u043A\u0442, \u043D\u0430 \u043A\u043E\u0442\u043E\u0440\u043E\u043C \u043E\u043D\u0438 \u0431\u044B\u043B\u0438 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u044B \u0438 \u0438\u0437\u043D\u0430\u0447\u0430\u043B\u044C\u043D\u043E \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u044B.\n\u0418\u0441\u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044E, \u043D\u0430\u0445\u043E\u0434\u044F\u0449\u0443\u044E\u0441\u044F \u0432\u043D\u0443\u0442\u0440\u0438. \u041A\u0443\u043B\u044C\u0442\u0438\u0432\u0438\u0440\u0443\u0439\u0442\u0435 \u0441\u043F\u043E\u0440\u044B \u0434\u043B\u044F \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0430 \u0442\u043E\u043F\u043B\u0438\u0432\u0430 \u0438 \u043F\u043B\u0430\u0441\u0442\u043C\u0430\u0441\u0441.\n\n[lightgray]\u041F\u043E\u0441\u043B\u0435 \u0440\u0430\u0437\u0432\u0430\u043B\u0430 \u044D\u0442\u043E\u0433\u043E \u043E\u0431\u044A\u0435\u043A\u0442\u0430 \u0441\u043F\u043E\u0440\u044B \u043E\u043A\u0430\u0437\u0430\u043B\u0438\u0441\u044C \u0432\u044B\u0431\u0440\u043E\u0448\u0435\u043D\u044B \u043D\u0430\u0440\u0443\u0436\u0443. \u041D\u0438\u0447\u0442\u043E \u0432 \u043C\u0435\u0441\u0442\u043D\u043E\u0439 \u044D\u043A\u043E\u0441\u0438\u0441\u0442\u0435\u043C\u0435 \u043D\u0435 \u043C\u043E\u0433\u043B\u043E \u0441\u043E\u043F\u0435\u0440\u043D\u0438\u0447\u0430\u0442\u044C \u0441 \u0442\u0430\u043A\u0438\u043C \u0430\u0433\u0440\u0435\u0441\u0441\u0438\u0432\u043D\u044B\u043C \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u043C\u043E\u043C.
sector.windsweptIslands.description = \u0414\u0430\u043B\u044C\u0448\u0435 \u0437\u0430 \u0431\u0435\u0440\u0435\u0433\u043E\u0432\u043E\u0439 \u043B\u0438\u043D\u0438\u0435\u0439 \u043F\u0440\u043E\u0441\u0442\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u044D\u0442\u0430 \u043E\u0442\u0434\u0430\u043B\u0435\u043D\u043D\u0430\u044F \u0447\u0435\u0440\u0435\u0434\u0430 \u043E\u0441\u0442\u0440\u043E\u0432\u043E\u0432. \u0421\u043E\u0433\u043B\u0430\u0441\u043D\u043E \u0437\u0430\u043F\u0438\u0441\u044F\u043C, \u043A\u043E\u0433\u0434\u0430-\u0442\u043E \u043E\u043D\u0438 \u0440\u0430\u0441\u043F\u043E\u043B\u0430\u0433\u0430\u043B\u0438 [accent]\u043F\u043B\u0430\u0441\u0442\u0430\u043D\u043E\u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u044F\u0449\u0438\u043C\u0438[] \u0441\u043E\u043E\u0440\u0443\u0436\u0435\u043D\u0438\u044F\u043C\u0438.\n\n\u041E\u0442\u0431\u0435\u0439\u0442\u0435\u0441\u044C \u043E\u0442 \u043C\u043E\u0440\u0441\u043A\u0438\u0445 \u0441\u0438\u043B \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430. \u0412\u043E\u0437\u0432\u0435\u0434\u0438\u0442\u0435 \u0431\u0430\u0437\u0443 \u043D\u0430 \u043E\u0441\u0442\u0440\u043E\u0432\u0430\u0445. \u0418\u0437\u0443\u0447\u0438\u0442\u0435 \u044D\u0442\u0438 \u0437\u0430\u0432\u043E\u0434\u044B.
sector.extractionOutpost.description = \u041E\u0442\u0434\u0430\u043B\u0435\u043D\u043D\u044B\u0439 \u0430\u0432\u0430\u043D\u043F\u043E\u0441\u0442, \u043F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0439 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u0441 \u0446\u0435\u043B\u044C\u044E \u043F\u0435\u0440\u0435\u0431\u0440\u043E\u0441\u043A\u0438 \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432 \u0432 \u0434\u0440\u0443\u0433\u0438\u0435 \u0441\u0435\u043A\u0442\u043E\u0440\u044B.\n\n\u041C\u0435\u0436\u0441\u0435\u043A\u0442\u043E\u0440\u043D\u0430\u044F \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u043D\u0430\u044F \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044F \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u0430 \u0434\u043B\u044F \u0434\u0430\u043B\u044C\u043D\u0435\u0439\u0448\u0435\u0433\u043E \u0437\u0430\u0432\u043E\u0435\u0432\u0430\u043D\u0438\u044F. \u0423\u043D\u0438\u0447\u0442\u043E\u0436\u044C\u0442\u0435 \u0431\u0430\u0437\u0443. \u0418\u0437\u0443\u0447\u0438\u0442\u0435 \u0438\u0445 \u043F\u0443\u0441\u043A\u043E\u0432\u044B\u0435 \u043F\u043B\u043E\u0449\u0430\u0434\u043A\u0438.
sector.impact0078.description = \u0417\u0434\u0435\u0441\u044C \u043B\u0435\u0436\u0430\u0442 \u043E\u0441\u0442\u0430\u0442\u043A\u0438 \u043C\u0435\u0436\u0437\u0432\u0435\u0437\u0434\u043D\u043E\u0433\u043E \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u043D\u043E\u0433\u043E \u0441\u0443\u0434\u043D\u0430, \u043F\u0435\u0440\u0432\u044B\u043C \u0432\u043E\u0448\u0435\u0434\u0448\u0435\u0433\u043E \u0432 \u044D\u0442\u0443 \u0441\u0438\u0441\u0442\u0435\u043C\u0443.\n\n\u0418\u0437\u0432\u043B\u0435\u043A\u0438\u0442\u0435 \u043A\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0431\u043E\u043B\u044C\u0448\u0435 \u0438\u0437 \u043E\u0431\u043B\u043E\u043C\u043A\u043E\u0432. \u0418\u0437\u0443\u0447\u0438\u0442\u0435 \u043B\u044E\u0431\u0443\u044E \u0443\u0446\u0435\u043B\u0435\u0432\u0448\u0443\u044E \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044E.
sector.planetaryTerminal.description = \u041A\u043E\u043D\u0435\u0447\u043D\u0430\u044F \u0446\u0435\u043B\u044C.\n\n\u042D\u0442\u0430 \u0431\u0435\u0440\u0435\u0433\u043E\u0432\u0430\u044F \u0431\u0430\u0437\u0430 \u0441\u043E\u0434\u0435\u0440\u0436\u0438\u0442 \u0441\u043E\u043E\u0440\u0443\u0436\u0435\u043D\u0438\u0435, \u0441\u043F\u043E\u0441\u043E\u0431\u043D\u043E\u0435 \u0437\u0430\u043F\u0443\u0441\u043A\u0430\u0442\u044C \u044F\u0434\u0440\u0430 \u043A \u043E\u043A\u0440\u0435\u0441\u0442\u043D\u044B\u043C \u043F\u043B\u0430\u043D\u0435\u0442\u0430\u043C. \u041E\u043D\u043E \u043A\u0440\u0430\u0439\u043D\u0435 \u0445\u043E\u0440\u043E\u0448\u043E \u043E\u0445\u0440\u0430\u043D\u044F\u0435\u0442\u0441\u044F.\n\n\u041F\u0440\u043E\u0438\u0437\u0432\u0435\u0434\u0438\u0442\u0435 \u043C\u043E\u0440\u0441\u043A\u0438\u0435 \u0435\u0434\u0438\u043D\u0438\u0446\u044B. \u0423\u043D\u0438\u0447\u0442\u043E\u0436\u044C\u0442\u0435 \u0432\u0440\u0430\u0433\u0430 \u043A\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0441\u043A\u043E\u0440\u0435\u0435. \u0418\u0437\u0443\u0447\u0438\u0442\u0435 \u043F\u0443\u0441\u043A\u043E\u0432\u0443\u044E \u043A\u043E\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u044E.
sector.coastline.description = \u0412 \u044D\u0442\u043E\u043C \u043C\u0435\u0441\u0442\u0435 \u0431\u044B\u043B\u0438 \u043E\u0431\u043D\u0430\u0440\u0443\u0436\u0435\u043D\u044B \u043E\u0441\u0442\u0430\u0442\u043A\u0438 \u0434\u0440\u0435\u0432\u043D\u0435\u0439 \u0432\u043E\u0435\u043D\u043D\u043E-\u043C\u043E\u0440\u0441\u043A\u043E\u0439 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0438. \u041E\u0442\u0431\u0435\u0439\u0442\u0435 \u0430\u0442\u0430\u043A\u0438 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430, \u0437\u0430\u0445\u0432\u0430\u0442\u0438\u0442\u0435 \u044D\u0442\u043E\u0442 \u0441\u0435\u043A\u0442\u043E\u0440 \u0438 \u0438\u0437\u0443\u0447\u0438\u0442\u0435 \u044D\u0442\u0443 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044E.
sector.navalFortress.description = \u0412\u0440\u0430\u0433 \u0432\u043E\u0437\u0432\u0435\u043B \u0431\u0430\u0437\u0443 \u043D\u0430 \u0443\u0434\u0430\u043B\u0435\u043D\u043D\u043E\u043C \u043E\u0441\u0442\u0440\u043E\u0432\u0435 \u0441 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u043C\u0438 \u0443\u043A\u0440\u0435\u043F\u043B\u0435\u043D\u0438\u044F\u043C\u0438. \u0423\u043D\u0438\u0447\u0442\u043E\u0436\u044C\u0442\u0435 \u0435\u0451. \u041E\u0432\u043B\u0430\u0434\u0435\u0439\u0442\u0435 \u0438\u0445 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0435\u0439 \u043F\u043E \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0443 \u043A\u043E\u0440\u0430\u0431\u043B\u0435\u0439 \u0438 \u0438\u0437\u0443\u0447\u0438\u0442\u0435 \u0435\u0435.
sector.facility32m.description = \u042D\u0442\u043E\u0442 \u0441\u0435\u043A\u0442\u043E\u0440 \u0441\u043E\u0434\u0435\u0440\u0436\u0438\u0442 \u0442\u043B\u0435\u044E\u0449\u0438\u0435 \u043E\u0441\u0442\u0430\u0442\u043A\u0438 \u0437\u0430\u0432\u043E\u0434\u0430 \u043F\u043E \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0443 \u0432\u0437\u0440\u044B\u0432\u0447\u0430\u0442\u044B\u0445 \u0432\u0435\u0449\u0435\u0441\u0442\u0432.\n\n\u0417\u0430\u0445\u0432\u0430\u0442\u0438\u0442\u0435 \u044D\u0442\u0443 \u0442\u0435\u0440\u0440\u0438\u0442\u043E\u0440\u0438\u044E. \u0418\u0437\u0443\u0447\u0438\u0442\u0435 \u041C\u0435\u0448\u0430\u043B\u043A\u0443 \u0432\u0437\u0440\u044B\u0432\u0447\u0430\u0442\u043E\u0439 \u0441\u043C\u0435\u0441\u0438. \u041F\u0440\u043E\u0438\u0437\u0432\u0435\u0434\u0438\u0442\u0435 \u0412\u0437\u0440\u044B\u0432\u0447\u0430\u0442\u0443\u044E \u0441\u043C\u0435\u0441\u044C \u0434\u043B\u044F \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u044F \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0431\u043E\u0435\u043F\u0440\u0438\u043F\u0430\u0441\u043E\u0432 \u0434\u043B\u044F \u0442\u0443\u0440\u0435\u043B\u0435\u0439.
sector.taintedWoods.description = [gray][\u043E\u043F\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u0430\u044F \u0446\u0435\u043B\u044C][]\n\u0411\u043E\u0433\u0430\u0442\u044B\u0439 \u0437\u0430\u043F\u0430\u0441\u0430\u043C\u0438 \u043D\u0435\u0444\u0442\u0438, \u044D\u0442\u043E\u0442 \u0441\u0435\u043A\u0442\u043E\u0440 \u0441\u043E\u0434\u0435\u0440\u0436\u0438\u0442 \u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u043C\u0430\u0441\u0441\u044B \u0433\u0440\u0438\u0431\u043A\u043E\u0432\u044B\u0445 \u0437\u0430\u0440\u043E\u0441\u043B\u0435\u0439, \u0447\u0442\u043E \u0437\u0430\u0442\u0440\u0443\u0434\u043D\u044F\u0435\u0442 \u043F\u0435\u0440\u0435\u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435.\n\n\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435 \u0435\u0433\u043E \u0440\u0435\u0441\u0443\u0440\u0441\u044B \u0434\u043B\u044F \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0430 \u041F\u043B\u0430\u0441\u0442\u0430\u043D\u0430. \u041E\u0442\u0440\u0430\u0437\u0438\u0442\u0435 \u0430\u0442\u0430\u043A\u0438 \u0432\u0440\u0430\u0433\u0430.
