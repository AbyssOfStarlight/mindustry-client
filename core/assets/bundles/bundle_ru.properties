block.tank-assembler.description = \u0421\u043E\u0431\u0438\u0440\u0430\u0435\u0442 \u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0442\u0430\u043D\u043A\u0438 \u0438\u0437 \u0432\u0432\u0435\u0434\u0451\u043D\u043D\u044B\u0445 \u0431\u043B\u043E\u043A\u043E\u0432 \u0438 \u0435\u0434\u0438\u043D\u0438\u0446. \u0423\u0440\u043E\u0432\u0435\u043D\u044C \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u043C\u044B\u0445 \u0435\u0434\u0438\u043D\u0438\u0446 \u043C\u043E\u0436\u0435\u0442 \u0431\u044B\u0442\u044C \u0443\u0432\u0435\u043B\u0438\u0447\u0435\u043D \u043F\u0443\u0442\u0435\u043C \u0434\u043E\u0431\u0430\u0432\u043B\u0435\u043D\u0438\u044F \u043C\u043E\u0434\u0443\u043B\u0435\u0439.
